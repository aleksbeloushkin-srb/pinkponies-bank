# Prometheus of the local stack: scrapes the admin listener of each service
# and evaluates the alert rules. There is no Alertmanager here; alerts are
# visible at http://localhost:9091/alerts.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: transfers
    static_configs:
      - targets: ["transfers:9100"]
  - job_name: ledger
    static_configs:
      - targets: ["ledger:9101"]
  - job_name: notifications
    static_configs:
      - targets: ["notifications:9102"]
