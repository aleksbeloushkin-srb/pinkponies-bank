# buf configuration: the module root is api/proto, so imports and the
# generated paths start at ledger/v1.
version: v2
modules:
  - path: api/proto
lint:
  use:
    - STANDARD
  # ErrorReason values are google.rpc.ErrorInfo reason strings, which by
  # convention are not prefixed with the enum name.
  ignore_only:
    ENUM_VALUE_PREFIX:
      - api/proto/ledger/v1/ledger.proto
breaking:
  use:
    - FILE
